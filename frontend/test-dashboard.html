<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusPulse Dashboard Test</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            min-width: 180px;
        }

        .chart {
            width: 700px;
            height: 350px;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>

    <h1>CampusPulse Dashboard Test</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">-</p>
        </div>

        <div class="card">
            <h3>Placement Rate</h3>
            <p id="placementRate">-</p>
        </div>

        <div class="card">
            <h3>Average CGPA</h3>
            <p id="averageCgpa">-</p>
        </div>

        <div class="card">
            <h3>Average Package</h3>
            <p id="averagePackage">-</p>
        </div>

    </div>


    <h2>Placement by Branch</h2>

    <div class="chart">
        <canvas id="branchChart"></canvas>
    </div>


    <h2>Placement by CGPA</h2>

    <div class="chart">
        <canvas id="cgpaChart"></canvas>
    </div>


    <h2>Internship Analysis</h2>

    <div class="chart">
        <canvas id="internshipChart"></canvas>
    </div>


    <h2>Average Package by Branch</h2>

    <div class="chart">
        <canvas id="salaryChart"></canvas>
    </div>


    <script>

        const testData = {

            overview: {

                total_students: 12000,

                placement_rate: 78.5,

                average_cgpa: 7.84,

                average_package: 6.72

            },


            branch_analysis: {

                branches: [
                    "CSE",
                    "ECE",
                    "EEE",
                    "ME",
                    "CE"
                ],

                placement_rates: [
                    88,
                    81,
                    76,
                    69,
                    64
                ],

                average_salary: [
                    8.2,
                    7.1,
                    6.4,
                    5.8,
                    5.2
                ]

            },


            cgpa_analysis: {

                groups: [
                    "5-6",
                    "6-7",
                    "7-8",
                    "8-9",
                    "9-10"
                ],

                placement_rates: [
                    45,
                    58,
                    71,
                    86,
                    94
                ]

            },


            internship_analysis: {

                labels: [
                    "With Internship",
                    "Without Internship"
                ],

                placement_rates: [
                    84,
                    52
                ]

            }

        };


        localStorage.setItem(
            "campusPulseAnalysis",
            JSON.stringify(testData)
        );

    </script>


    <script src="dashboard.js"></script>

</body>

</html>
